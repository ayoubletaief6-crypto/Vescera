<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A55">
<title>Vescera Lavage – احجز موعدك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F3F4F9;--card:#fff;--ink:#14193A;--mute:#5E6685;--line:#DCDFEE;--teal:#2A3FA6;--teal2:#4C63D2;--navy:#1B2A55;--sign:#F7D23E;--bad:#C8432F;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1226;--card:#161E3A;--ink:#EDEFFA;--mute:#9AA3C7;--line:#28325C;--teal:#5A72E6;--navy:#16224A}}
:root[data-theme="dark"]{--bg:#0C1226;--card:#161E3A;--ink:#EDEFFA;--mute:#9AA3C7;--line:#28325C;--teal:#5A72E6;--navy:#16224A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.45;background:radial-gradient(900px 380px at 100% -80px,rgba(76,99,210,.18),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 58px;color:#fff;text-align:center;background:linear-gradient(135deg,var(--navy) 0%,#2A3FA6 60%,var(--teal2) 100%);box-shadow:0 18px 40px -12px rgba(27,42,85,.45)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:150px;height:150px;left:-40px;top:-50px;animation:bob 7s ease-in-out infinite}
.hero:after{width:90px;height:90px;left:70px;bottom:20px;background:rgba(255,255,255,.07);animation:bob 9s ease-in-out infinite reverse}
.name{position:relative;font-weight:800;font-size:clamp(34px,11vw,48px);line-height:1.05;letter-spacing:3px;margin:8px 0 6px;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.name:after{content:"";display:block;width:112px;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,#F7D23E 0 14px,#1B2A55 14px 28px);margin:12px auto 0}
.name .v{color:#F7D23E}
.name .l{display:inline-block;margin-top:8px;padding:2px 18px;border-radius:12px;background:#fff;color:#2A3FA6;text-shadow:none;box-shadow:0 6px 16px rgba(8,12,30,.3)}
.hero p{position:relative;margin:12px 0 10px;color:#e8ecff}
.hours{position:relative;display:inline-block;padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:.9rem}
form{position:relative;margin-top:-10px;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:16px;box-shadow:0 18px 40px -18px rgba(42,63,166,.45)}
label{display:grid;gap:4px;font-weight:700;font-size:.95rem}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);width:100%;transition:border-color .35s ease,box-shadow .35s ease}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(76,99,210,.22);outline:0}
button:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:800 17px 'Tajawal',sans-serif;height:56px;border:0;border-radius:20px;background:linear-gradient(90deg,var(--teal),var(--teal2));color:#fff;cursor:pointer;box-shadow:0 12px 26px -8px rgba(42,63,166,.65);transition:transform .1s}
button:active{transform:scale(.98)}
#msg{min-height:1.4em;font-weight:700;color:var(--bad)}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:40px;overflow:hidden;direction:ltr}
.wave svg{position:absolute;left:0;top:0;width:200%;height:100%;display:block;animation:flow 12s linear infinite}
.wave .w1{fill:rgba(255,255,255,.28)}
.wave .w2{fill:var(--bg)}
.wave svg:last-child{}
@keyframes flow{to{transform:translateX(-50%)}}
@keyframes bob{50%{transform:translateY(-14px) scale(1.06)}}
button{background-size:200% 100%;transition:transform .25s ease,box-shadow .25s ease,background-position .6s ease}
button:hover{background-position:100% 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="name" dir="ltr"><span class="v">VESCERA</span><br><span class="l">LAVAGE</span></div>
<p>عمّر الفورم وإحنا نأكدولك الموعد في أقرب وقت.</p>
<span class="hours">من الإثنين للسبت · 8:00 – 17:00</span>
<div class="wave" aria-hidden="true"><svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path class="w1" d="M0 18 Q150 0 300 18 T600 18 T900 18 T1200 18 V40 H0Z"/><path class="w2" d="M0 24 Q150 6 300 24 T600 24 T900 24 T1200 24 V40 H0Z"/></svg></div>
</header>
<form id="f" novalidate>
<label>الاسم<input id="name" autocomplete="name" required></label>
<label>رقم الهاتف<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07 XX XX XX XX" required></label>
<label>نوع الكرهبة<input id="car" placeholder="مثال: Peugeot 208 – 2018"></label>
<label>الخدمة
<select id="service">
<option>غسيل داخلي</option>
<option>غسيل خارجي</option>
<option>غسيل خارجي وداخلي</option>
<option>غسيل المحرك</option>
<option>التلميع</option>
</select></label>
<div class="row">
<label>التاريخ<input id="date" type="date" required></label>
<label>الوقت
<select id="time">
<option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option>
<option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option>
</select></label>
</div>
<label>ملاحظات<textarea id="note" rows="3" placeholder="أي حاجة تحب تعلمنا بيها (اختياري)"></textarea></label>
<div id="msg" role="status"></div>
<button type="submit">ابعث طلب الحجز</button>
</form>
</div>
<script>
var WHATSAPP = "213770333232"; // 0770333232 بكود الجزائر 213
var d = document.getElementById('date');
var t = new Date(); t.setMinutes(t.getMinutes()-t.getTimezoneOffset());
d.min = t.toISOString().slice(0,10);
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = function(i){return document.getElementById(i).value.trim();};
  var msg = document.getElementById('msg');
  if(!v('name') || !v('phone') || !v('date')){ msg.textContent='عمّر الاسم ورقم الهاتف والتاريخ.'; return; }
  var text = 'طلب حجز موعد - Vescera Lavage\nالاسم: '+v('name')+'\nالهاتف: '+v('phone')+'\nالكرهبة: '+v('car')+
    '\nالخدمة: '+v('service')+'\nالتاريخ: '+v('date')+' على '+v('time')+'\nملاحظات: '+v('note');
  msg.style.color='var(--teal)'; msg.textContent='جاري فتح واتساب...';
  window.location.href = 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(text);
});
</script>
</body>
</html>
